<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Restore sidebar state before the page is painted. -->
    <script>
        try {
            if (localStorage.getItem("winops.sidebar.collapsed") === "true") {
                document.documentElement.classList.add("winops-sidebar-collapsed");
            }
        } catch (error) {
            // Continue with the default expanded layout.
        }
    </script>



    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | WinOps Manager</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
	<link rel="shortcut icon" href="images/favicon.ico?v=2">

    <link rel="stylesheet"
          th:href="@{/css/GlobalStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/ComingSoonStyle.css}">

</head>


<body>

<div class="app-layout">


    <!-- SIDEBAR -->

    <div th:replace="~{fragments/sidebar :: sidebar}">
    </div>


    <div class="app-content">


        <!-- TOP BAR -->

        <div th:replace="~{fragments/topbar :: topbar}">
        </div>


        <main class="page-content">


            <section class="coming-soon-container">

                <div class="coming-soon-card">


                    <div class="coming-soon-icon">

                        <span>•••</span>

                    </div>


                    <span class="page-label">
                        WINOPS MANAGER
                    </span>


                    <h1>
                        Coming Soon
                    </h1>


                    <p>
                        This section is currently under development.
                        Additional system administration tools and
                        workstation management features will be
                        available here soon.
                    </p>


                    <div class="coming-soon-status">

                        <span class="coming-soon-status-dot"></span>

                        <span>
                            Development in progress
                        </span>

                    </div>


                    <a th:href="@{/policies}"
                       class="button-primary coming-soon-button">

                        Back to Policies

                    </a>


                </div>

            </section>


        </main>


        <!-- FOOTER -->

        <div th:replace="~{fragments/footer :: footer}">
        </div>


    </div>

</div>

</body>

</html>
