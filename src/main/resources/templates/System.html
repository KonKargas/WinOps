<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Restore sidebar state before the page is painted. -->
    <script>
        try {
            if (localStorage.getItem("winops.sidebar.collapsed") === "true") {
                document.documentElement.classList.add("winops-sidebar-collapsed");
            }
        } catch (error) {
            // Continue with the default expanded layout.
        }
    </script>



    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>System | WinOps Manager</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
	<link rel="shortcut icon" href="images/favicon.ico?v=2">

    <link rel="stylesheet"
          th:href="@{/css/GlobalStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/SystemStyle.css}">

    <script defer th:src="@{/js/system-progressive.js}"></script>
</head>


<body>

<div class="app-layout">


    <!-- SIDEBAR -->

    <div th:replace="~{fragments/sidebar :: sidebar}">
    </div>


    <div class="app-content">


        <!-- TOP BAR -->

        <div th:replace="~{fragments/topbar :: topbar}">
        </div>


        <main class="page-content">


            <!-- PAGE HEADER -->
			<section class="page-heading system-page-heading">
			
			    <div>
			
			        <span class="page-label">
			            SYSTEM
			        </span>
			
			        <h1>
			            System Management
			        </h1>
			
			        <p>
			            View hardware and operating system information,
			            configure Windows settings and access advanced
			            system administration tools.
			        </p>
			
			    </div>
			
			
			    <!-- SYSTEM ACTIONS -->
			
			    <div class="system-header-actions">
			
			
			        <form th:action="@{/system/lock}"
			              method="post">
			
			            <button type="submit"
			                    class="system-header-button">
			
			                Lock
			
			            </button>
			
			        </form>
			
			
			        <form th:action="@{/system/sleep}"
			              method="post">
			
			            <button type="submit"
			                    class="system-header-button">
			
			                Sleep
			
			            </button>
			
			        </form>
			
			
			        <form th:action="@{/system/restart}"
			              method="post"
			              onsubmit="return confirm('Are you sure you want to restart this computer?');">
			
			            <button type="submit"
			                    class="system-header-button system-header-warning">
			
			                Restart
			
			            </button>
			
			        </form>
			
			
			        <form th:action="@{/system/shutdown}"
			              method="post"
			              onsubmit="return confirm('Are you sure you want to shut down this computer?');">
			
			            <button type="submit"
			                    class="system-header-button system-header-danger">
			
			                Shutdown
			
			            </button>
			
			        </form>
			
			
			    </div>
			
			</section>


            <div id="system-data-container" aria-live="polite" aria-busy="true">
                <section class="system-loading" role="status">
                    <div class="system-loading-spinner" aria-hidden="true"></div>
                    <div><strong>Loading system information...</strong>
                    <p>Windows, hardware and power settings are being retrieved.</p></div>
                </section>
            </div>

        </main>


        <!-- FOOTER -->

        <div th:replace="~{fragments/footer :: footer}">
        </div>


    </div>

</div>

</body>

</html>
